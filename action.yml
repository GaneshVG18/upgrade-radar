name: Upgrade Radar
description: Evidence-linked review queue for npm dependency behavior changes
inputs:
  repo:
    description: Local checked-out repository to analyze; defaults to the workflow workspace
    required: false
    default: ''
  base:
    description: Optional base Git commit SHA. When omitted, review infers a local main/master merge-base or HEAD~1.
    required: false
    default: ''
  head:
    description: Optional head Git commit SHA; defaults to HEAD.
    required: false
    default: ''
  notes-dir:
    description: Optional custom reviewed-notes directory. Bundled Express/Zod notes are used when omitted.
    required: false
    default: ''
  provider:
    description: baseline or jev; live Jev requires TYPESAFE_API_KEY in the step environment
    required: false
    default: baseline
  out:
    description: Report output directory
    required: false
    default: artifacts/upgrade-radar
runs:
  using: composite
  steps:
    - name: Set up Node 24
      uses: actions/setup-node@v4
      with:
        node-version: '24.11.1'
    - name: Build Upgrade Radar
      shell: bash
      run: npm ci --prefix "$GITHUB_ACTION_PATH" --ignore-scripts && npm run --prefix "$GITHUB_ACTION_PATH" build
    - name: Analyze dependency diff
      shell: bash
      env:
        UPGRADE_RADAR_REPO: ${{ inputs.repo }}
        UPGRADE_RADAR_BASE: ${{ inputs.base }}
        UPGRADE_RADAR_HEAD: ${{ inputs.head }}
        UPGRADE_RADAR_NOTES_DIR: ${{ inputs.notes-dir }}
        UPGRADE_RADAR_PROVIDER: ${{ inputs.provider }}
        UPGRADE_RADAR_OUT: ${{ inputs.out }}
      run: |
        repo="$UPGRADE_RADAR_REPO"
        if [ -z "$repo" ]; then repo="$GITHUB_WORKSPACE"; fi
        args=(
          review
          --repo "$repo"
          --provider "$UPGRADE_RADAR_PROVIDER"
          --out "$UPGRADE_RADAR_OUT"
        )
        if [ -n "$UPGRADE_RADAR_BASE" ]; then
          args+=(--base "$UPGRADE_RADAR_BASE")
        fi
        if [ -n "$UPGRADE_RADAR_HEAD" ]; then
          args+=(--head "$UPGRADE_RADAR_HEAD")
        fi
        if [ -n "$UPGRADE_RADAR_NOTES_DIR" ]; then
          args+=(--notes-dir "$UPGRADE_RADAR_NOTES_DIR")
        fi
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}"
    - name: Add job summary
      if: always()
      shell: bash
      run: |
        if [ -f "${{ inputs.out }}/report.md" ]; then
          cat "${{ inputs.out }}/report.md" >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Upload report artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: upgrade-radar-report
        path: ${{ inputs.out }}
        if-no-files-found: warn
