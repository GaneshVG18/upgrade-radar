name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:compat
      - run: npm run build
      - run: npm run smoke
      - name: Baseline example reports
        run: |
          node dist/cli.js analyze --repo ./examples/express-app --package express --from 4.21.2 --to 5.1.0 --notes ./examples/notes/express-5.md --provider baseline --out artifacts/express
          node dist/cli.js analyze --repo ./examples/zod-app --package zod --from 3.25.76 --to 4.1.5 --notes ./examples/notes/zod-4.md --provider baseline --out artifacts/zod
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-reports
          path: artifacts
          if-no-files-found: error
